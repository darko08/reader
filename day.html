const API = 'https://mempool.space/api';
const $ = id => document.getElementById(id);
const out = $('day'), input = $('d');
const ABSTRACT = new Set(SETS.abstract), PEOPLE = new Set(SETS.people), HUMAN = new Set(SETS.human_verbs);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function say(text) { out.replaceChildren(el('div', 'msg', text)); }

// ---- the reading rule (same as reader.html) --------------------------------
function read(hash) {
  const hex = hash.toLowerCase();
  const silence = hex.length - hex.replace(/^0+/, '').length;
  const body = hex.slice(silence, silence + 16).padEnd(16, '0');
  const idx = [];
  for (let i = 0; i < 8; i++) idx.push(parseInt(body.slice(i * 2, i * 2 + 2), 16) % 256);
  return { silence, idx, words: idx.map((n, c) => COLS[c][n]) };
}

// ---- the page's scorer: a line-for-line port of score.py and score8.py -----
// It only chooses which readings this page shows first. It is not part of the reading rule.
const tg = w => TAGS[w] || '';
const has = (w, letters) => [...letters].some(l => tg(w).includes(l));
const isConn = w => tg(w).includes('C') && !has(w, 'PNVJ');
const isSubj = w => has(w, 'PN');
const isVerb = w => tg(w).includes('V');

function clauses(words) {
  const res = [];
  for (let i = 0; i < words.length - 1; i++) {
    if (!isSubj(words[i])) continue;
    const a = words[i + 1];
    if (isVerb(a) && (!isSubj(a) || tg(words[i]).includes('P') || tg(a).includes('J'))) { res.push([i, i + 1]); continue; }
    if (i + 2 < words.length && has(a, 'XM')) {
      const b = words[i + 2];
      if (isVerb(b) || (tg(a).includes('X') && has(b, 'JN'))) res.push([i, i + 2]);
    }
  }
  return res;
}

function baseScore(words) {
  let s = 0;
  if (new Set(words).size < words.length - 1) s -= 2;
  const last = words[words.length - 1];
  if (isConn(last) || last === 'quiet') s -= 3;
  for (let k = 0; k < words.length - 1; k++) if (isConn(words[k]) && isConn(words[k + 1])) s -= 2;
  const cl = clauses(words);
  if (!cl.length) return s - 5;
  s += 2;
  const [i, j] = cl[0];
  if (tg(words[i]).includes('P') || j === i + 1) s += 1;
  if (cl.some(c => c[0] > j)) s += 1;
  if (j + 1 < words.length && has(words[j + 1], 'NJ')) s += 1;
  const nconn = words.filter(isConn).length;
  s += (nconn >= 1 && nconn <= 3) ? 1 : -1;
  if (isSubj(words[0]) && !isConn(words[0])) s += 1;
  return s;
}

function surprise(words) {
  let b = 0;
  for (const [i, j] of clauses(words)) {
    const s = words[i], v = words[j];
    if (!PEOPLE.has(s) && !ABSTRACT.has(s) && HUMAN.has(v)) b += 2;
    if (ABSTRACT.has(s) && isVerb(v) && !HUMAN.has(v)) b += 2;
  }
  for (let k = 0; k < words.length - 1; k++) {
    const v = words[k], o = words[k + 1];
    if (isVerb(v) && !HUMAN.has(v) && ABSTRACT.has(o)) b += 1;
  }
  return Math.min(b, 4);
}

const score = words => baseScore(words) + surprise(words);

function rank(rows, top = 50, limit = 3, penalty = 2) {
  rows.forEach(r => { r.final = score(r.words); });
  for (;;) {
    rows.sort((a, b) => (b.final - a.final) || (a.height - b.height));
    const seen = {};
    let changed = false;
    for (const r of rows.slice(0, top)) {
      const end = r.words[r.words.length - 1];
      seen[end] = (seen[end] || 0) + 1;
      if (seen[end] > limit) { r.final -= penalty; changed = true; }
    }
    if (!changed) return rows;
  }
}

// ---- fetching one UTC day of blocks from mempool.space ----------------------
async function json(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('mempool.space answered ' + res.status);
  return res.json();
}

async function blocksOfDay(start, end, progress) {
  // the last block at or before the end of the day, then walk down 15 at a time
  const edge = await json(API + '/v1/mining/blocks/timestamp/' + Math.min(end, Math.floor(Date.now() / 1000)));
  const found = new Map();
  let h = edge.height + 6;                       // block times are not strictly ordered; start a little above
  for (let guard = 0; guard < 40 && h >= 0; guard++) {
    let page;
    try { page = await json(API + '/v1/blocks/' + h); }
    catch (e) { if (guard === 0) { h = edge.height; continue; } throw e; }
    if (!page.length) break;
    for (const b of page) if (b.timestamp >= start && b.timestamp < end) found.set(b.height, b);
    progress(found.size);
    const newest = Math.max(...page.map(b => b.timestamp));
    if (newest < start - 7200) break;            // a whole page well before the day: done
    h = page[page.length - 1].height - 1;
  }
  return [...found.values()].sort((a, b) => a.height - b.height);
}

// ---- the piece: half-readings that hold together, spread across the day ----
function spread(list, n) {
  if (list.length <= n) return list;
  const res = [];
  for (let k = 0; k < n; k++) res.push(list[Math.floor((k + 0.5) * list.length / n)]);
  return res;
}
function piece(rows) {
  const noZero = (r, a, b) => r.idx.slice(a, b).every(x => x !== 0);
  // first halves: subject, verb, then a determiner or preposition before the place
  const firsts = rows.filter(r => r.idx[2] >= 1 && r.idx[2] <= 30 && noZero(r, 0, 4));
  // second halves: a true conjunction opening the second clause
  const used = new Set(firsts.map(r => r.height));
  const seconds = rows.filter(r => r.idx[4] >= 1 && r.idx[4] <= 19 && noZero(r, 4, 8) && !used.has(r.height));
  // each first half is answered by the next second half that follows it in the day
  const a = spread(firsts, 4), lines = [];
  for (let k = 0; k < a.length; k++) {
    lines.push({ r: a[k], text: a[k].words.slice(0, 4).join(' ') });
    const until = k + 1 < a.length ? a[k + 1].height : Infinity;
    const b = seconds.find(r => r.height > a[k].height && r.height < until);
    if (b) lines.push({ r: b, text: b.words.slice(4).join(' ') });
  }
  return lines;
}

// ---- rendering --------------------------------------------------------------
const hhmm = t => new Date(t * 1000).toISOString().slice(11, 16);
const link = (r, text, cls) => { const a = el('a', cls, text); a.href = 'reader.html#' + r.height; return a; };

function render(date, rows) {
  const first = rows[0], last = rows[rows.length - 1];
  const at = el('div', 'at', date + ' UTC · ' + rows.length + ' blocks · ' +
    first.height.toLocaleString('en-US') + ' to ' + last.height.toLocaleString('en-US'));

  const s1 = el('section');
  const wh = el('div', 'whisper');
  rows.forEach(r => wh.append(link(r, r.words[0], r.idx[0] === 0 ? 'zero' : null)));
  s1.append(el('h2', null, "the day's whisper"), wh);

  const s2 = el('section');
  const ol = el('ol', 'picks');
  rank(rows.slice()).slice(0, 5).forEach(r => {
    const li = el('li');
    const t = el('time', null, hhmm(r.timestamp));
    const a = link(r, '');
    r.words.forEach((w, c) => { a.append(el('span', r.idx[c] === 0 ? 'zero' : null, w), c < 7 ? ' ' : ''); });
    li.append(t, a, el('small', null, r.height.toLocaleString('en-US')));
    ol.append(li);
  });
  s2.append(el('h2', null, "the page's picks"), ol,
    el('p', 'note', "These five are an editorial choice, made by this page's scorer (score8.py). The scorer is not part of the reading rule and is not carved. Every block of the day reads the same for everyone; only this shortlist is the page's opinion."));

  const s3 = el('section');
  const pc = el('div', 'piece');
  piece(rows).forEach(l => pc.append(link(l.r, l.text)));
  s3.append(el('h2', null, 'a piece from the day'), pc,
    el('p', 'note', 'Each line is half of one block\'s reading, unchanged and in the order of the day. Follow a line to its block.'));

  out.replaceChildren(at, s1, s2, s3);
}

async function show(date) {
  const start = Date.parse(date + 'T00:00:00Z') / 1000;
  if (isNaN(start)) { say('enter a date'); return; }
  if (start * 1000 > Date.now()) { say('that day has not happened yet'); return; }
  say('reading the day…');
  try {
    const blocks = await blocksOfDay(start, start + 86400, n => say('reading the day… ' + n + ' blocks'));
    if (!blocks.length) { say('no blocks on that day'); return; }
    const rows = blocks.map(b => Object.assign({ height: b.height, timestamp: b.timestamp }, read(b.id)));
    render(date, rows);
    if (location.hash.slice(1) !== date) history.replaceState(null, '', '#' + date);
  } catch (e) { say(e.message || 'could not reach mempool.space'); }
}

$('f').addEventListener('submit', e => { e.preventDefault(); show(input.value); });
addEventListener('hashchange', () => { const d = location.hash.slice(1); if (/^\d{4}-\d\d-\d\d$/.test(d)) { input.value = d; show(d); } });

const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
input.max = new Date().toISOString().slice(0, 10);
input.value = /^\d{4}-\d\d-\d\d$/.test(location.hash.slice(1)) ? location.hash.slice(1) : yesterday;
show(input.value);
</script>
